name: MiPeque CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
          VITE_ADMIN_WHATSAPP: "5493810000000"
          VITE_VAPID_PUBLIC_KEY: BC8qCWVQdUOQ66D5Y8X8uUfH7LCyoqOLjYJ7vklpQ8jLIl1D1JJM_w5eCEskQhNHjcjzRWY4XGNG7yZ9C8k2rO0
